name: Deploy health

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify-production-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm verify:deploy
